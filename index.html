<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Web Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            /* Soft pastel gradient background */
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333333;
            transition: background 0.5s ease, color 0.5s ease;
        }
        
        .dark-mode {
            /* Dark gradient background */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
        }

        h1 {
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .button-group {
            margin-bottom: 25px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            width: 240px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: background 0.5s ease, color 0.5s ease;
        }

        .dark-mode .card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        button {
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            border-radius: 8px;
            border: none;
            background-color: #4f46e5;
            color: white;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
        }

        input {
            padding: 10px;
            width: 80%;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>My Interactive Web Page</h1>

    <div class="button-group">
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <button onclick="showAlert()">Show Welcome Message</button>
    </div>

    <div class="container">
        <div class="card">
            <h3>Click Counter</h3>
            <h2 id="counter">0</h2>
            <button onclick="incrementCounter()">Click Me</button>
        </div>

        <div class="card">
            <h3>Live Text Display</h3>
            <input type="text" id="userInput" oninput="updateText()" placeholder="Type something...">
            <p>You typed: <b id="textOutput"></b></p>
        </div>
    </div>

    <script>
        let count = 0;

        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = count;
        }

        function updateText() {
            const inputVal = document.getElementById('userInput').value;
            document.getElementById('textOutput').innerText = inputVal;
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function showAlert() {
            alert('Welcome to my interactive website!');
        }
    </script>

</body>
</html>
